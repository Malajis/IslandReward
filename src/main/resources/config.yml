# ========== 奖励领取开关及导出配置 ==========
export:
  enabled: false
  data-file: "island_data.yml"

# ========== 周目配置 ==========
completion-threshold: 10000
current-week: "第二周目"
previous-week: "第一周目"
# 当前读取的上个周目数据文件编号 (对应 island_data_{N}.yml)
previous-week-data: 1
time-format: "yyyy-MM-dd HH:mm:ss"

# ========== 奖励配置 ==========
rewards:
  souvenir:
    material: NAME_TAG
    name: "§6§l⭐ {player} 的 {previous_week} 纪念品 §6§l⭐"
    lore:
      - "§7这是你在 {previous_week} 空岛生存的成就证明"
      - ""
      - "§8§m------------------"
      - "§7玩家ID: §f{player}"
      - "§e📊 {previous_week} 等级: §6{level} §7级"
      - "§e🏆 获得通关次数: §6+{completions} §7次"
      - "§8§m------------------"
      - ""
      - "§7颁发时间: §o{date}"
      - ""
      - "§7感谢你参与 {previous_week} 的冒险！"
      - "§7祝你在 {current_week} 再创佳绩！"
      - ""
      - "§e纪念品"

  level-rewards:
    '10000':
      items:
      - material: DIAMOND
        amount: 64
      - material: NETHERITE_INGOT
        amount: 10
      - material: BEACON
        amount: 5
      - material: NETHER_STAR
        amount: 3
      commands:
      - 'broadcast §6§l🎉 恭喜 §e{player} §6§l完成 {previous_week} 空岛通关！等级: §e{level}
        §6§l级 🎉'
    '5000':
      items:
      - material: DIAMOND
        amount: 32
      - material: NETHERITE_INGOT
        amount: 5
      - material: BEACON
        amount: 2
      commands:
      - broadcast §a§l恭喜 §e{player} §a§l在 {previous_week} 达到 §e{level} §a§l级！
    '1000':
      items:
      - material: DIAMOND
        amount: 16
      - material: NETHERITE_INGOT
        amount: 2
      commands:
      - msg {player} §a恭喜你在 {previous_week} 达到 §e{level} §a级！
    '1':
      items:
      - material: DIAMOND
        amount: 5
      commands:
      - msg {player} §e感谢参与 {previous_week}，期待你在 {current_week} 有更好的表现！
  
  completion:
    items:
    - material: DRAGON_EGG
      amount: 1
    commands:
    - broadcast §6§l🎉 恭喜 §e{player} §6§l空岛通关次数 §e+1 §6§l🎉

# ========== 语言配置 ==========
messages:
  # 通用消息前缀（单独提示消息会加上此前缀）
  prefix: "§8[§b周目奖励§8] "

  # ========== 通用消息（带前缀） ==========
  no-permission: "§c你没有权限执行此命令！"
  player-only: "§c此命令只能由玩家执行！"
  not-number: "§c次数必须是一个有效数字！"
  inventory-full: "§e背包已满，部分奖励已掉落在地上！"
  reward-disabled: "§c奖励系统当前已关闭，无法领取奖励！"
  already-claimed: "§c你已经领取过 {previous_week} 的奖励了！"
  no-data: "§c未找到你在 {previous_week} 的数据记录！"

  # ========== 玩家提醒消息（全部无前缀） ==========
  reminder-header: "§e§m                                              §r"
  reminder-message: "  §6§l📢 {previous_week} 奖励提醒\n\n  §7你在 {previous_week} 的岛屿等级为 §6{level} §7级"
  reminder-completed: "  §6§l★ 恭喜！你已达成通关条件！★"
  reminder-commands: "\n  §e§l快捷操作:\n  §7▸ §6/ir claim §7领取奖励\n  §7▸ §6/ir myinfo §7查看数据总览"
  reminder-footer: "§e§m                                              §r"

  # ========== 领取奖励消息（全部无前缀） ==========
  reward-header: "§a§m                                              §r"
  reward-success: "  §a§l🎁 奖励领取成功！\n\n  §7你在 {previous_week} 的岛屿等级为 §6{level} §7级"
  reward-completed: "\n  §6§l★ 通关成就达成！★"
  reward-not-completed: "\n  §7未达到通关要求（需 ≥ §6{threshold} §7级）\n  §7继续加油，下个周目一定通关！"
  reward-footer: "§a§m                                              §r"
  completion-total: "  §7累计通关次数: §6{count} §7次"

  # ========== info GUI 菜单专属 ==========
  gui-title: "§8§l周目数据总览"
  gui-week-item-name: "§e第{week}周目"
  gui-week-item-lore:
    - "§7等级: §6{level} §7级"
    - "§7通关判定: {completed}"
    - "§7奖励状态: {claimed_status}"
  gui-week-item-lore-view:
    - "§7等级: §6{level} §7级"
    - "§7通关判定: {completed}"
  gui-week-item-no-data-lore:
    - "§7暂无数据"
  gui-completion-item-name: "§6累计通关次数"
  gui-completion-item-lore:
    - "§e{count} §7次"
  gui-previous-week-tag: " §b[上个周目]"
  gui-claimed-tag: "§c已领取"
  gui-unclaimed-tag: "§a可领取"
  gui-click-claim: "§e§l点击此处快捷领取"

  # ========== 管理员命令消息（重载消息无前缀，其他有前缀） ==========
  export-started: "§a数据导出已开始，请查看控制台日志！"
  reload-success: "§a配置重载完成！"
  reload-completion: "  §7通关次数数据: §6{count} §7条"
  reload-data: "  §7{previous_week}数据: §6{count} §7条"
  reload-claimed: "  §7已领取玩家: §6{count} §7人"
  reload-status: "  §7奖励系统: {status}"
  status-enabled: "§a已开启"
  status-disabled: "§c已关闭"

  # ========== completion 子命令（带前缀） ==========
  add-success: "§a已为 §e{player} §a增加 §6{amount} §a次通关记录"
  add-current: "§7当前累计: §6{count} §7次"

  # ========== reimport 命令（带前缀） ==========
  reimport-success: "§a已重新导入 {previous_week} 数据，共 §6{count} §a条"
  reimport-hint: "§7玩家可使用 §6/ir myinfo §7查看数据，§6/ir claim §7领取奖励"

  # ========== record 子命令（领取记录管理） ==========
  clear-claimed-usage: "§e用法:\n  §6/ir record clear <玩家名> §7清除指定玩家的领取记录\n  §6/ir record clear all §7清除所有玩家的领取记录"
  clear-claimed-all: "§a已清除所有领取记录，共 §6{count} §a条"
  clear-claimed-hint: "§7玩家现在可以重新领取 {previous_week} 的奖励"
  clear-claimed-player: "§a已清除玩家 §e{player} §a的领取记录"
  clear-claimed-player-hint: "§7该玩家现在可以重新领取 {previous_week} 的奖励"
  clear-claimed-notify-header: "§e§m                                              §r"
  clear-claimed-notify-message: "  §6§l📢 管理员已重置你的 {previous_week} 奖励领取资格！"
  clear-claimed-notify-level: "  §7你的 {previous_week} 等级为 §6{level} §7级"
  clear-claimed-notify-command: "\n  §7▸ 使用 §6/ir claim §7重新领取奖励"
  clear-claimed-notify-footer: "§e§m                                              §r"
  clear-claimed-not-found: "§c玩家 {player} 没有领取记录或不存在"

  # ========== completion 子命令（通关记录管理） ==========
  clear-completion-usage: "§e用法:\n  §6/ir completion clear <玩家名> §7清除指定玩家的通关记录\n  §6/ir completion clear all §7清除所有玩家的通关记录"
  clear-completion-all: "§a已清除所有通关记录，共 §6{count} §a条"
  clear-completion-player: "§a已清除玩家 §e{player} §a的通关记录"
  clear-completion-old: "§7原通关次数: §6{count} §7次 → §c0 §7次"
  clear-completion-notify-header: "§e§m                                              §r"
  clear-completion-notify-message: "  §6§l📢 管理员已重置你的通关记录！"
  clear-completion-notify-old: "  §7原通关次数: §6{count} §7次 → §c0 §7次"
  clear-completion-notify-footer: "§e§m                                              §r"
  clear-completion-not-found: "§c玩家 {player} 没有通关记录或不存在"

  # ========== 状态文字（无前缀） ==========
  status-claimed: "§a已领取"
  status-unclaimed: "§e未领取"
  status-completed: "§a已通关"
  status-not-completed: "§c未通关"

  # ========== 帮助信息（无前缀） ==========
  help-header: "§6§l▎IslandReward §e"

  # ========== 用法提示（带前缀） ==========
  completion-add-usage: "§c用法: /ir completion add <玩家名> <次数>"
  record-clear-usage: "§c用法: §c  /ir record clear <玩家名> §7清除指定玩家领取记录\n§c  /ir record clear all §7清除所有领取记录"
  completion-clear-usage: "§c用法: §c  /ir completion clear <玩家名> §7清除指定玩家通关记录\n§c  /ir completion clear all §7清除所有通关记录"