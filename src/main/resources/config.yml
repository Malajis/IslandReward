# ========== 奖励领取及导出配置 ==========
export:
  enabled: false
  data-file: "island_data.yml"

# ========== 周目配置 ==========
completion-threshold: 10000
current-week: "第二周目"
previous-week: "第一周目"
time-format: "yyyy-MM-dd HH:mm:ss"

# ========== 奖励配置 ==========
rewards:
  souvenir:
    material: NAME_TAG
    name: "§6§l⭐ {player} 的 {previous_week} 纪念品 §6§l⭐"
    lore:
      - "§7这是你在 {previous_week} 空岛生存的成就证明"
      - ""
      - "§8§m------------------"
      - "§7玩家ID: §f{player}"
      - "§e📊 {previous_week} 等级: §6{level} §7级"
      - "§e🏆 获得通关次数: §6+{completions} §7次"
      - "§8§m------------------"
      - ""
      - "§7颁发时间: §o{date}"
      - ""
      - "§7感谢你参与 {previous_week} 的冒险！"
      - "§7祝你在 {current_week} 再创佳绩！"

  level-rewards:
    10000:
      items:
        - material: DIAMOND
          amount: 64
        - material: NETHERITE_INGOT
          amount: 10
        - material: BEACON
          amount: 5
        - material: NETHER_STAR
          amount: 3
      commands:
        - "broadcast §6§l🎉 恭喜 §e{player} §6§l完成 {previous_week} 空岛通关！等级: §e{level} §6§l级 🎉"
    5000:
      items:
        - material: DIAMOND
          amount: 32
        - material: NETHERITE_INGOT
          amount: 5
        - material: BEACON
          amount: 2
      commands:
        - "broadcast §a§l恭喜 §e{player} §a§l在 {previous_week} 达到 §e{level} §a§l级！"
    1000:
      items:
        - material: DIAMOND
          amount: 16
        - material: NETHERITE_INGOT
          amount: 2
      commands:
        - "msg {player} §a恭喜你在 {previous_week} 达到 §e{level} §a级！"
    1:
      items:
        - material: DIAMOND
          amount: 5
      commands:
        - "msg {player} §e感谢参与 {previous_week}，期待你在 {current_week} 有更好的表现！"

  completion:
    items:
      - material: BEACON
        amount: 1
      - material: NETHER_STAR
        amount: 1
      - material: DRAGON_EGG
        amount: 1
    commands:
      - "broadcast §6§l🎉 恭喜 §e{player} §6§l空岛通关次数 §e+1 §6§l🎉"

# ========== 语言配置 ==========
messages:
  # 通用消息前缀（单独提示消息会加上此前缀）
  prefix: "§8[§b周目奖励§8] "

  # ========== 通用消息（带前缀） ==========
  no-permission: "§c你没有权限执行此命令！"
  player-only: "§c此命令只能由玩家执行！"
  not-number: "§c次数必须是数字！"
  inventory-full: "§e你的背包已满，部分奖励已掉落在地上！"
  reward-disabled: "§c奖励系统当前已关闭，无法领取奖励！"
  already-claimed: "§c你已经领取过{previous_week}奖励了！"
  no-data: "§c未找到你的{previous_week}数据！"

  # ========== 玩家提醒消息（全部无前缀） ==========
  reminder-header: "§e§l================================="
  reminder-message: "§e📢 检测到你{previous_week}有未领取的奖励！\n§e{previous_week}等级: §6{level} §7级"
  reminder-completed: "§6★ 已达成通关条件！★"
  reminder-commands: "§e使用 §6/ir claim §e领取奖励\n§e使用 §6/ir info §e查看详细数据"
  reminder-footer: "§e§l================================="

  # 通关次数显示（带前缀）
  completion-display: "§e你累计通关了 §6{count} §e次！"

  # ========== 领取奖励消息（全部无前缀） ==========
  reward-header: "§a================================="
  reward-success: "§a恭喜你获得{previous_week}奖励！\n§e你的{previous_week}等级: §6{level} §7级"
  reward-completed: "§6★ 恭喜你完成{previous_week}空岛通关！★"
  reward-not-completed: "§e未达到通关要求（需 ≥ {threshold} 级）\n§7继续努力，下个周目争取通关！"
  reward-footer: "§a================================="
  completion-total: "§e累计通关次数: §6{count} §e次"

  # ========== 查看信息消息（全部无前缀，因为都是框框） ==========
  info-header: "§6§l========= {previous_week}数据 ========="
  info-level: "§e你的{previous_week}等级: §6{level} §7级"
  info-completed: "§e通关判定: "
  info-completed-yes: "§a✔ 已通关 (≥ {threshold} 级)"
  info-completed-no: "§c✘ 未通关"
  info-completion-gain: "§e将获得通关记录: "
  info-gain-yes: "§6+1"
  info-gain-no: "§7+0"
  info-claim-status: "§e奖励状态: "
  info-claimed-yes: "§c已领取"
  info-claimed-no: "§a可领取"
  info-footer: "§6§l=============================="
  info-claim-command: "§a使用 §6/ir claim §a领取奖励！"

  # ========== mycompletion 命令（全部无前缀，因为都是框框） ==========
  mycompletion-header: "§6§l========= 你的数据 ========="
  mycompletion-count: "§e累计通关次数: §6{count} §e次"
  mycompletion-threshold: "§e通关要求: §7达到 {threshold} 级（一次性成就）"
  mycompletion-footer: "§6§l==========================="

  # ========== 管理员命令消息（重载消息无前缀，其他有前缀） ==========
  export-started: "§a数据导出已开始，请查看控制台日志！"
  reload-success: "§a插件已重载！"
  reload-completion: "§a通关次数: {count} 条"
  reload-data: "§a{previous_week}数据: {count} 条"
  reload-claimed: "§a已领取玩家: {count} 人"
  reload-status: "§a奖励领取: {status}"
  status-enabled: "§a已开启"
  status-disabled: "§c已关闭"

  # ========== check 命令（全部无前缀，因为都是信息展示） ==========
  check-header: "§e玩家 {player}:"
  check-completion: "§e  累计通关次数: §6{count} §e次"
  check-level: "§e  {previous_week}等级: §6{level} §7级"
  check-completed: "§e  {previous_week}通关: "
  check-yes: "§a是"
  check-no: "§c否"
  check-claimed: "§e  奖励状态: "
  check-claimed-yes: "§c已领取"
  check-claimed-no: "§a未领取"
  check-no-data: "§e  {previous_week}数据: §7无"

  # ========== add 命令（带前缀） ==========
  add-success: "§a已为玩家 {player} 增加 {amount} 次通关记录"
  add-current: "§a当前累计: {count} 次"

  # ========== reimport 命令（带前缀） ==========
  reimport-success: "§a已重新导入{previous_week}数据，共 {count} 条"
  reimport-hint: "§e玩家可使用 /ir info 查看，/ir claim 领取"

  # ========== clear 命令（领取记录） ==========
  clear-claimed-usage: "§e用法:\n§e  /ir clear <玩家名> §7- 清除指定玩家的领取记录\n§e  /ir clear all §7- 清除所有领取记录"
  clear-claimed-all: "§a已清除所有领取记录，共 {count} 条"
  clear-claimed-hint: "§e玩家现在可以重新领取{previous_week}奖励"
  clear-claimed-player: "§a已清除玩家 {player} 的领取记录"
  clear-claimed-player-hint: "§e该玩家现在可以重新领取{previous_week}奖励"
  clear-claimed-notify-header: "§e§l================================="
  clear-claimed-notify-message: "§e📢 管理员已重置你的奖励领取资格！"
  clear-claimed-notify-level: "§e{previous_week}等级: §6{level} §7级"
  clear-claimed-notify-command: "§e使用 §6/ir claim §e重新领取奖励"
  clear-claimed-notify-footer: "§e§l================================="
  clear-claimed-not-found: "§c玩家 {player} 没有领取记录或不存在"

  # ========== clearcompletion 命令（通关记录） ==========
  clear-completion-usage: "§e用法:\n§e  /ir clearcompletion <玩家名> §7- 清除指定玩家的通关记录\n§e  /ir clearcompletion all §7- 清除所有通关记录"
  clear-completion-all: "§a已清除所有通关记录，共 {count} 条"
  clear-completion-player: "§a已清除玩家 {player} 的通关记录"
  clear-completion-old: "§a原通关次数: §6{count} §a次，已重置为 0"
  clear-completion-notify-header: "§e§l================================="
  clear-completion-notify-message: "§e📢 管理员已重置你的通关记录！"
  clear-completion-notify-old: "§e原通关次数: §6{count} §e次，已重置为 0"
  clear-completion-notify-footer: "§e§l================================="
  clear-completion-not-found: "§c玩家 {player} 没有通关记录或不存在"

  # ========== 状态文字（无前缀） ==========
  status-claimed: "§a已领取"
  status-unclaimed: "§e未领取"
  status-completed: "§a已通关"
  status-not-completed: "§c未通关"

  # ========== 帮助信息（无前缀） ==========
  help-header: "§6§l========= IslandReward 帮助 ========="
  help-player-title: "§e§l【玩家命令】"
  help-claim: "§e/ir claim §7- 领取{previous_week}奖励"
  help-info: "§e/ir info §7- 查看{previous_week}信息"
  help-mycompletion: "§e/ir mycompletion §7- 查看自己的通关次数"
  help-admin-title: "§e§l【管理员命令】"
  help-export: "§e/ir export §7- 导出玩家等级数据"
  help-reload: "§e/ir reload §7- 重载配置"
  help-check: "§e/ir check <玩家> §7- 查看玩家通关次数"
  help-add: "§e/ir add <玩家> <次数> §7- 增加玩家通关次数"
  help-reimport: "§e/ir reimport §7- 重新导入{previous_week}数据"
  help-clear: "§e/ir clear §7- 清除领取记录"
  help-clearcompletion: "§e/ir clearcompletion §7- 清除通关记录"
  help-help: "§e/ir help §7- 查看帮助"
  help-footer: "§6§l============================"
  help-permission-note: "§7注: 管理员命令需要 islandreward.admin 权限"

  # ========== 用法提示（带前缀） ==========
  usage-check: "§c用法: /ir check <玩家名>"
  usage-add: "§c用法: /ir add <玩家名> <次数>"