name: IslandReward
version: 2.0
main: me.malajis.IslandReward.Main
api-version: 1.13
author: Malajis
description: 岛屿周目奖励系统 - 支持多周目数据管理、BentoBox数据导出、PlaceholderAPI变量

commands:
  islandreward:
    description: 岛屿周目奖励系统主命令
    usage: /<command> [claim|myinfo|info|export|reload|reimport|completion|record|help]
    aliases: [ir]
  ir:
    description: 岛屿周目奖励系统快捷命令
    usage: /ir [claim|myinfo|info|export|reload|reimport|completion|record|help]

permissions:
  islandreward.admin:
    description: 管理员权限
    default: op